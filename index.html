
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Leidilson Mendes — Software Development & Creative Services.">

    <meta name="theme-color" content="#111111">

    <title>Leidilson Mendes | Links</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #111111;
            color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .avatar {
            display: block;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #444444;
            margin: 0 auto 22px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 9px;
            letter-spacing: -0.8px;
        }

        .subtitle {
            color: #a3a3a3;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .tagline {
            color: #737373;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 35px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .link {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 17px 35px;
            border: 1px solid #383838;
            border-radius: 10px;
            color: #f5f5f5;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: 0.25s ease;
        }

        .link:hover {
            background: #f5f5f5;
            color: #111111;
            border-color: #f5f5f5;
            transform: translateY(-3px);
        }

        .link span {
            display: block;
            margin-top: 5px;
            font-size: 12px;
            font-weight: normal;
            color: #999999;
        }

        .link:hover span {
            color: #555555;
        }

        .contact {
            margin-top: 32px;
        }

        .contact-label {
            color: #666666;
            font-size: 10px;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .contact a {
            color: #aaaaaa;
            font-size: 13px;
            text-decoration: none;
            transition: color 0.25s ease;
        }

        .contact a:hover {
            color: #ffffff;
        }

        footer {
            margin-top: 35px;
            color: #666666;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            body {
                padding: 35px 20px;
            }

            h1 {
                font-size: 25px;
            }

            .avatar {
                width: 100px;
                height: 100px;
            }

            .link {
                padding: 17px 20px;
                min-height: 65px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <img
            class="avatar"
            src="https://github.com/leidilson.png"
            alt="Avatar de Leidilson Mendes"
        >

        <h1>Leidilson Mendes</h1>

        <p class="subtitle">
            Software Development & Creative Services
        </p>

        <p class="tagline">
            LEARNING. BUILDING. IMPROVING.
        </p>

        <nav class="links" aria-label="Redes sociais">

            <a class="link"
               href="https://github.com/leidilson"
               target="_blank"
               rel="noopener noreferrer">
                GitHub
                <span>Projetos e desenvolvimento</span>
            </a>

            <a class="link"
               href="https://www.linkedin.com/in/leidilson-mendes-01b365444/"
               target="_blank"
               rel="noopener noreferrer">
                LinkedIn
                <span>Perfil profissional</span>
            </a>

            <a class="link"
               href="https://www.instagram.com/prodbyleh/"
               target="_blank"
               rel="noopener noreferrer">
                Instagram
                <span>Edição de vídeo e Motion Design</span>
            </a>

        </nav>

        <section class="contact">
            <p class="contact-label">CONTACTO PROFISSIONAL</p>

            <a href="mailto:lehbusiness8@gmail.com">
                lehbusiness8@gmail.com
            </a>
        </section>

        <footer>
            © 2026 Leidilson Mendes
        </footer>

    </main>

</body>
</html>
