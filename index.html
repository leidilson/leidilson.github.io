
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Leidilson Mendes — Desenvolvimento de Software, Edição de Vídeo e Motion Design.">
    <title>Leidilson Mendes | Links</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #111111;
            color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #444;
            margin-bottom: 22px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 9px;
            letter-spacing: -0.8px;
        }

        .subtitle {
            color: #a3a3a3;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .tagline {
            color: #737373;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 35px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .link {
            display: block;
            padding: 17px 20px;
            border: 1px solid #383838;
            border-radius: 10px;
            color: #f5f5f5;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: 0.25s ease;
        }

        .link:hover {
            background: #f5f5f5;
            color: #111111;
            border-color: #f5f5f5;
            transform: translateY(-3px);
        }

        .link span {
            display: block;
            margin-top: 5px;
            font-size: 12px;
            font-weight: normal;
            color: #999999;
        }

        .link:hover span {
            color: #555555;
        }

        footer {
            margin-top: 40px;
            color: #666666;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 25px;
            }

            .avatar {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <img
            class="avatar"
            src="https://github.com/leidilson.png"
            alt="Avatar de Leidilson Mendes"
        >

        <h1>Leidilson Mendes</h1>

        <p class="subtitle">
            Aspiring Software Developer
        </p>

        <p class="tagline">
            LEARNING. BUILDING. IMPROVING.
        </p>

        <nav class="links">

            <a class="link"
               href="https://github.com/leidilson"
               target="_blank"
               rel="noopener noreferrer">
                GitHub
                <span>Projetos e desenvolvimento</span>
            </a>

            <a class="link"
               href="https://www.linkedin.com/in/leidilson-mendes-01b365444/"
               target="_blank"
               rel="noopener noreferrer">
                LinkedIn
                <span>Perfil profissional</span>
            </a>

            <a class="link"
               href="https://www.instagram.com/prodbyleh/"
               target="_blank"
               rel="noopener noreferrer">
                Instagram
                <span>Edição de vídeo e motion design</span>
            </a>

        </nav>

        <footer>
            © 2026 Leidilson Mendes
        </footer>

    </main>

</body>
</html>
